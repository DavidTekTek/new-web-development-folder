<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Rolling Dice</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #17172b, #3b176b);
        font: 16px system-ui;
        color: #fff;
      }
      .game {
        text-align: center;
        background: #ffffff18;
        padding: 30px;
        border-radius: 24px;
        box-shadow: 0 15px 45px #0005;
      }
      .dice {
        display: flex;
        gap: 22px;
        justify-content: center;
        margin: 24px;
      }
      .die {
        width: 86px;
        height: 86px;
        background: #fff;
        color: #5b21b6;
        border-radius: 16px;
        display: grid;
        place-items: center;
        font-size: 4rem;
        font-weight: bold;
        box-shadow: 0 8px 0 #c4b5fd;
        transition: transform 0.15s;
      }
      .rolling {
        animation: roll 0.65s linear infinite;
      }
      @keyframes roll {
        to {
          transform: rotate(360deg);
        }
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 12px 25px;
        background: #fbbf24;
        color: #24113f;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #fde047;
      }
      p {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <main class="game">
      <h1>🎲 Rolling Dice</h1>
      <p>Roll the dice and match your luck!</p>
      <section class="dice">
        <div class="die" id="die1">⚀</div>
        <div class="die" id="die2">⚀</div>
      </section>
      <h2 id="result">Ready to roll?</h2>
      <button id="roll">ROLL DICE</button>
    </main>
    <script>
      const faces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"],
        a = document.querySelector("#die1"),
        b = document.querySelector("#die2"),
        result = document.querySelector("#result"),
        button = document.querySelector("#roll");
      function rollDice() {
        button.disabled = true;
        a.classList.add("rolling");
        b.classList.add("rolling");
        result.textContent = "Rolling...";
        setTimeout(() => {
          let x = Math.floor(Math.random() * 6),
            y = Math.floor(Math.random() * 6);
          a.textContent = faces[x];
          b.textContent = faces[y];
          a.classList.remove("rolling");
          b.classList.remove("rolling");
          result.textContent =
            x === y ? "🎉 Doubles!" : `You rolled ${x + y + 2}`;
          button.disabled = false;
        }, 700);
      }
      button.addEventListener("click", rollDice);
    </script>
  </body>
</html>
