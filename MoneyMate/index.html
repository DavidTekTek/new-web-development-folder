<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MoneyMate - Expense Tracker</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>💰 MoneyMate</h1>

      <p>Track your money. Reach your goals.</p>
    </header>

    <main>
      <!-- =========================
         SUMMARY SECTION
    ========================== -->

      <section class="summary">
        <div class="card">
          <h3>Total Income</h3>
          <p id="income">₦0</p>
        </div>

        <div class="card">
          <h3>Total Expenses</h3>
          <p id="expenses">₦0</p>
        </div>

        <div class="card">
          <h3>Balance</h3>
          <p id="balance">₦0</p>
        </div>
      </section>

      <!-- =========================
         ADD TRANSACTION
    ========================== -->

      <section class="box">
        <h2>Add Transaction</h2>

        <input
          type="text"
          id="description"
          placeholder="What did you spend on?"
        />

        <input type="number" id="amount" placeholder="Amount" />

        <select id="type">
          <option value="income">Income</option>

          <option value="expense">Expense</option>
        </select>

        <button onclick="addTransaction()">Add Transaction</button>
      </section>

      <!-- =========================
         TRANSACTION LIST
    ========================== -->

      <section class="box">
        <h2>Transaction History</h2>

        <ul id="transactionList">
          <li>No transactions yet.</li>
        </ul>
      </section>

      <!-- =========================
         SAVINGS GOAL
    ========================== -->

      <section class="box savings">
        <h2>🎯 Savings Goal</h2>

        <input type="number" id="goal" placeholder="Enter your savings goal" />

        <input
          type="number"
          id="saved"
          placeholder="How much have you saved?"
        />

        <button onclick="calculateSavings()">Calculate Progress</button>

        <div class="progress">
          <div id="progressBar"></div>
        </div>

        <p id="savingResult">Set a goal to begin.</p>
      </section>
    </main>

    <footer>
      <p>MoneyMate © 2026</p>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
